<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 논문/학생지도 알아보기</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #dfe3ea; --accent: #1f4e9c; --accent-soft: #e8eefa;
    --past: #8a5a00; --past-soft: #fff4dc; --now: #0f6b46; --now-soft: #e3f5ec;
    --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1d2129; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #313745; --accent: #7fa6ec; --accent-soft: #243250;
      --past: #f0c060; --past-soft: #3a2f17; --now: #6fd3a5; --now-soft: #163a2b;
      --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section.box {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  h2 .hint { font-weight: 400; color: var(--muted); font-size: .9rem; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-block; padding: 8px 16px; border: 1px solid var(--line);
    border-radius: 999px; cursor: pointer; user-select: none; background: var(--card);
    transition: background .12s, border-color .12s;
  }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip input:disabled + span { opacity: .4; cursor: not-allowed; }
  .chip.current span::after { content: " (이번 학기)"; font-size: .8em; }
  .counter { margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .counter.full { color: var(--warn); }
  button#go {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border: 0;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button#go:disabled { opacity: .45; cursor: not-allowed; }
  #result { margin-top: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-left-width: 6px;
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card.past { border-left-color: var(--past); }
  .card.now  { border-left-color: var(--now); }
  .tag { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .past .tag { background: var(--past-soft); color: var(--past); }
  .now .tag  { background: var(--now-soft); color: var(--now); }
  .card h3 { margin: 0 0 12px; font-size: 1.15rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; word-break: break-all; }
  ol { margin: 0; padding-left: 20px; }
  figure { margin: 16px 0 0; }
  figure img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
  figcaption { font-size: .9rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .img-missing { padding: 24px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; font-size: .9rem; }
  .copy { margin-left: 8px; font-size: .8rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
  footer { margin-top: 32px; font-size: .85rem; color: var(--muted); }
  .card.info { border-left-color: var(--accent); }
  .info .tag { background: var(--accent-soft); color: var(--accent); }
  .card ul { margin: 0; padding-left: 20px; }
  .card li + li { margin-top: 4px; }
  .alert {
    background: var(--past-soft); color: var(--text); border-radius: 8px;
    padding: 12px 14px; margin: 0 0 12px; font-size: .95rem;
  }
  .alert b { color: var(--past); }
  .now .alert { background: var(--now-soft); }
  .now .alert b { color: var(--now); }
  .path { font-family: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: .9em; }
  table.status { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .9rem; }
  table.status th, table.status td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
  table.status th { background: var(--bg); font-weight: 600; }
  figure img { cursor: zoom-in; }
  figcaption::after { content: " · 누르면 크게 보기"; font-weight: 400; }
  #zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    overflow: auto; z-index: 10; cursor: zoom-out; padding: 16px;
  }
  #zoom.open { display: block; }
  #zoom img { display: block; max-width: none; width: 1600px; margin: 0 auto; background: #fff; }
</style>
</head>
<body>
<main>
  <h1>내 논문/학생지도 알아보기</h1>
  <p class="sub">과정과 납부할 학기를 선택하면 학기별 신청·납부 방법을 알려드립니다.</p>

  <section class="box">
    <h2>1. 본인의 과정</h2>
    <div class="chips" id="courses"></div>
  </section>

  <section class="box">
    <h2>2. 납부할 학기 <span class="hint" id="semHint">과정을 먼저 선택하세요</span></h2>
    <div class="chips" id="semesters"></div>
    <div class="counter" id="counter"></div>
  </section>

  <button id="go" disabled>조회하기</button>

  <div id="result" aria-live="polite"></div>

  <footer id="footer"></footer>
</main>
<div id="zoom" role="dialog" aria-label="이미지 크게 보기"><img alt=""></div>

const imagesOf = (group) => IMAGES.filter((im) => im.group === group);

const $ = (s) => document.querySelector(s);

// 날짜 → 이번 학기 {year, term}
function currentSemester(d = new Date()) {
  const y = d.getFullYear(), m = d.getMonth() + 1;
  return { year: y, term: m >= CONFIG.fallStartMonth ? 2 : 1 };
}
const semKey = (s) => s.year * 2 + (s.term - 1);           // 정렬용 숫자
const semLabel = (s) => `${String(s.year).slice(-2)}-${s.term}`;

// 이번 학기부터 yearsBack년 전 같은 학기까지 (최신순)
function semesterList() {
  const cur = currentSemester();
  const list = [];
  for (let k = semKey(cur); k >= semKey(cur) - CONFIG.yearsBack * 2; k--) {
    list.push({ year: Math.floor(k / 2), term: (k % 2) + 1 });
  }
  return list;
}

const CUR = currentSemester();
const SEMS = semesterList();
let course = null;

// ---- 렌더링: 선택지 ----
$("#courses").innerHTML = CONFIG.courses.map((c) =>
  `<label class="chip"><input type="radio" name="course" value="${c.id}"><span>${c.label}</span></label>`
).join("");

$("#semesters").innerHTML = SEMS.map((s) =>
  `<label class="chip${semKey(s) === semKey(CUR) ? " current" : ""}">
     <input type="checkbox" name="sem" value="${semKey(s)}" disabled><span>${semLabel(s)}</span>
   </label>`
).join("");

$("#footer").textContent =
  `이번 학기: ${semLabel(CUR)} · 선택 가능 범위: ${semLabel(SEMS[SEMS.length - 1])} ~ ${semLabel(SEMS[0])} · ${CONFIG.contact}`;

const semBoxes = () => [...document.querySelectorAll('input[name="sem"]')];

function refresh() {
  const boxes = semBoxes();
  const checked = boxes.filter((b) => b.checked).length;
  if (!course) {
    boxes.forEach((b) => (b.disabled = true));
    $("#go").disabled = true;
    return;
  }
  const full = checked >= course.max;
  const curOnly = (b) => course.onlyCurrent && Number(b.value) !== semKey(CUR);
  boxes.forEach((b) => (b.disabled = curOnly(b) || (!b.checked && full)));
  // 받침 유무로 은/는 선택
  const code = course.label.charCodeAt(course.label.length - 1) - 0xac00;
  const topic = course.label + (code >= 0 && code % 28 ? "은" : "는");
  $("#semHint").textContent = course.onlyCurrent
    ? `${topic} 이번 학기(${semLabel(CUR)})만 선택 가능`
    : `${topic} 최대 ${course.max}개까지 선택 가능`;
  const c = $("#counter");
  c.textContent = `${course.note} · ${checked} / ${course.max} 선택` + (full ? " — 최대 개수에 도달했습니다" : "");
  c.classList.toggle("full", full);
  $("#go").disabled = checked === 0;
}

$("#courses").addEventListener("change", (e) => {
  course = CONFIG.courses.find((c) => c.id === e.target.value);
  // 과정을 바꿨을 때 선택할 수 없는 학기와 한도를 넘는 선택은 해제 (최근 학기부터 남김)
  if (course.onlyCurrent) semBoxes().forEach((b) => { if (Number(b.value) !== semKey(CUR)) b.checked = false; });
  semBoxes().filter((b) => b.checked).slice(course.max).forEach((b) => (b.checked = false));
  $("#result").innerHTML = "";
  refresh();
});
$("#semesters").addEventListener("change", () => { $("#result").innerHTML = ""; refresh(); });

// ---- 렌더링: 결과 ----
const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const won = (n) => n.toLocaleString("ko-KR") + "원";
const path = (p) => `<span class="path">${esc(p)}</span>`;
const mail = () => `<a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a>`;
const images = (list) => list.map((im) => `<figure>
    <figcaption>${esc(im.title)}</figcaption>
    <img src="${esc(im.src)}" alt="${esc(im.title)}" loading="lazy"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'img-missing',textContent:'이미지 준비 중입니다: ${esc(im.title)}'}))">
  </figure>`).join("");

// 하나은행 계좌 납부 카드. pastLabels: 지난 학기들, curLabel: (수료생) 이번 학기
function bankCard(pastLabels, curLabel, tag) {
  const b = CONFIG.bank;
  const all = [...pastLabels, ...(curLabel ? [curLabel] : [])];
  const apply = [];
  if (pastLabels.length) apply.push(`<li>입금 후, 지난 학기(${pastLabels.join(", ")}) 논문지도 신청은 ${mail()} 로 요청합니다. <b>학번을 반드시 적어주세요.</b></li>`);
  if (curLabel) apply.push(`<li>입금 후, 이번 학기(${curLabel}) 논문지도 신청은 학사행정시스템에서 직접 합니다.<br>${path(CONFIG.paths.apply)} → <b>[신규]</b> → 입력 → <b>[저장]</b>${images(imagesOf("신청"))}</li>`);
  return `<article class="card past">
    <span class="tag">${esc(tag)}</span>
    <h3>${all.join(", ")} — 하나은행 계좌 납부</h3>
    <p class="alert"><b>입금자명에는 이름 대신 학번(숫자만)</b>을 적어주세요. 예) 202512345</p>
    <dl>
      <dt>은행</dt><dd>${esc(b.name)}</dd>
      <dt>계좌번호</dt><dd>${esc(b.account)}<button class="copy" data-copy="${esc(b.account)}">복사</button></dd>
      <dt>예금주</dt><dd>${esc(b.holder)}</dd>
      <dt>입금자명</dt><dd>본인 학번 (숫자만)</dd>
      <dt>금액</dt><dd>${won(CONFIG.fee)} × ${all.length}학기 = ${won(CONFIG.fee * all.length)}</dd>
    </dl>
    <ol>
      <li>먼저 위 계좌로 ${won(CONFIG.fee * all.length)}을 입금합니다. (입금자명: 학번 숫자만)</li>
      ${apply.join("")}
      <li>계좌 입금은 담당자가 직접 입력하므로 <b>반영까지 약 5일</b> 걸립니다. 반영 여부는 신청 화면의 '지도비' 칸 또는 ${path(CONFIG.paths.payment)} 에서 확인할 수 있습니다.</li>
    </ol>
    ${images(imagesOf("계좌납부"))}
  </article>`;
}

// 이번 학기 가상계좌 납부 카드
function virtualCard(label) {
  return `<article class="card now">
    <span class="tag">이번 학기</span>
    <h3>${label} — 행정시스템 신청 후 가상계좌 납부</h3>
    <ol>
      <li>학사행정시스템에서 논문지도를 직접 신청합니다. (매 학기 초 수강신청기간 내)<br>${path(CONFIG.paths.apply)} → <b>[신규]</b> → 입력 → <b>[저장]</b><br>저장하면 상태가 '제출'로 표시됩니다.${images(imagesOf("신청"))}</li>
      <li>가상계좌를 조회합니다.
        <p class="alert"><b>가상계좌가 없는 경우</b> → 이미 등록금 납부 시에 (학생경비 등과 함께) 납부한 경우입니다. 추가로 납부하지 않아도 됩니다.(만일, 수료생이시면 일반계좌로 납부바랍니다.)<br>납부 여부는 ${path(CONFIG.paths.payment)} 에서 확인할 수 있습니다.</p>
        ${path(CONFIG.paths.virtual)} → <b>[조회]</b>${images(imagesOf("가상계좌"))}</li>
      <li>조회된 가상계좌로 ${won(CONFIG.fee)}을 수납기간 내에 납부합니다. <b>반영까지 약 1일</b> 걸릴 수 있습니다.</li>
    </ol>
  </article>`;
}

      <tr><th>상태</th><th>지도비</th><th>합격</th><th>의미</th></tr>
      <tr><td>제출</td><td>미납부</td><td>제출</td><td>지도비를 납부해 주세요</td></tr>
      <tr><td>제출</td><td>납부</td><td>제출</td><td>지도교수님께 점수 입력을 요청하세요</td></tr>
      <tr><td>승인</td><td>납부</td><td>합격</td><td>1회 인정 완료</td></tr>
    </table>
  </article>`;
}

$("#go").addEventListener("click", () => {
  const picked = semBoxes().filter((b) => b.checked).map((b) => Number(b.value)).sort((a, b) => a - b);
  const toSem = (k) => ({ year: Math.floor(k / 2), term: (k % 2) + 1 });
  const past = picked.filter((k) => k < semKey(CUR)).map((k) => semLabel(toSem(k)));
  const hasCur = picked.includes(semKey(CUR));
  const bankAll = course.alwaysBank;  // 수료생: 이번 학기도 계좌 납부
  let html = "";
  if (past.length || (hasCur && bankAll)) {
    html += bankCard(past, hasCur && bankAll ? semLabel(CUR) : null, bankAll ? course.label : "지난 학기");
  }
  if (hasCur && !bankAll) html += virtualCard(semLabel(CUR));
  html += infoCard();
  $("#result").innerHTML = html;
  $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
});

// 이미지 크게 보기
$("#result").addEventListener("click", (e) => {
  const img = e.target.closest("figure img");
  if (!img) return;
  $("#zoom img").src = img.src;
  $("#zoom img").alt = img.alt;
  $("#zoom").classList.add("open");
});
$("#zoom").addEventListener("click", () => $("#zoom").classList.remove("open"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#zoom").classList.remove("open"); });

$("#result").addEventListener("click", async (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "복사됨"; }
  catch { btn.textContent = "복사 실패"; }
  setTimeout(() => (btn.textContent = "복사"), 1500);
});

refresh();
</script>
